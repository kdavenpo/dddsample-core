server:
    servlet:
        context-path: /dddsample

logging:
    level:
        jdbc: debug
        'se.citerus.dddsample': debug

uploadDirectory: /tmp/upload
parseFailureDirectory: /tmp/failed

brokerUrl: "vm://localhost?broker.persistent=false&broker.useJmx=false"

# Pathfinder, the routing service, runs as its own application (pathfinder/)
pathfinder:
    url: http://localhost:8081

spring:
    dataSource:
        url: jdbc:hsqldb:mem:dddsample
        username: sa
        password: ""

jdbc:
    datasource-proxy:
        enabled: true
        query:
            logger-name: jdbc
            enable-logging: true
        multiline: false
        include-parameter-values: true
