# Generated by deploy/generate.py (DECISIONS 65): C3 deployed as 5 services.
# Run from this folder:  $env:RUN="c3-run1"; docker compose up -d
name: cargo-c3

x-limits: &limits
  cpus: 1.0
  mem_limit: 768m

x-env: &env
  SPRING_DATASOURCE_URL: jdbc:hsqldb:hsql://db:9001/dddsample
  BROKERURL: tcp://activemq:61616
  PATHFINDER_URL: http://unused:8081

services:
  db:
    <<: *limits
    image: dddsample-c3:local
    command: ["java", "-cp", "/app/hsqldb.jar", "org.hsqldb.server.Server",
              "--database.0", "mem:dddsample", "--dbname.0", "dddsample", "--address", "0.0.0.0", "--port", "9001"]

  activemq:
    <<: *limits
    image: apache/activemq-classic:6.1.2

  seed:                                # creates the schema and loads the sample data, then exits
    <<: *limits
    image: dddsample-c3:local
    restart: on-failure                # until the database and broker accept connections
    depends_on: [db, activemq]
    environment: *env
    command: ["java", "-jar", "/app/app.jar", "--split.seed-only=true",
              "--spring.main.web-application-type=none", "--spring.jpa.hibernate.ddl-auto=create",
              "--dddsample.sample-data=true"]

  service-0:
    <<: *limits
    image: dddsample-c3:local
    restart: on-failure
    depends_on:
      seed: {condition: service_completed_successfully}
    environment: *env
    command: ["java", "-jar", "/app/app.jar", "--spring.profiles.active=subject",
              "--spring.config.import=file:/config/split.properties",
              "--spring.jpa.hibernate.ddl-auto=none", "--dddsample.sample-data=false",
              "--server.tomcat.accesslog.prefix=access-service-0"]
    volumes: ["./split-service-0.properties:/config/split.properties:ro", "../runs/${RUN:-c3-test}:/app/logs"]

  service-1:
    <<: *limits
    image: dddsample-c3:local
    restart: on-failure
    depends_on:
      seed: {condition: service_completed_successfully}
    environment: *env
    command: ["java", "-jar", "/app/app.jar", "--spring.profiles.active=subject",
              "--spring.config.import=file:/config/split.properties",
              "--spring.jpa.hibernate.ddl-auto=none", "--dddsample.sample-data=false",
              "--server.tomcat.accesslog.prefix=access-service-1"]
    volumes: ["./split-service-1.properties:/config/split.properties:ro", "../runs/${RUN:-c3-test}:/app/logs"]

  service-2:
    <<: *limits
    image: dddsample-c3:local
    restart: on-failure
    depends_on:
      seed: {condition: service_completed_successfully}
    environment: *env
    command: ["java", "-jar", "/app/app.jar", "--spring.profiles.active=subject",
              "--spring.config.import=file:/config/split.properties",
              "--spring.jpa.hibernate.ddl-auto=none", "--dddsample.sample-data=false",
              "--server.tomcat.accesslog.prefix=access-service-2"]
    volumes: ["./split-service-2.properties:/config/split.properties:ro", "../runs/${RUN:-c3-test}:/app/logs"]

  service-3:
    <<: *limits
    image: dddsample-c3:local
    restart: on-failure
    depends_on:
      seed: {condition: service_completed_successfully}
    environment: *env
    command: ["java", "-jar", "/app/app.jar", "--spring.profiles.active=subject",
              "--spring.config.import=file:/config/split.properties",
              "--spring.jpa.hibernate.ddl-auto=none", "--dddsample.sample-data=false",
              "--server.tomcat.accesslog.prefix=access-service-3"]
    volumes: ["./split-service-3.properties:/config/split.properties:ro", "../runs/${RUN:-c3-test}:/app/logs"]

  service-4:
    <<: *limits
    image: dddsample-c3:local
    restart: on-failure
    depends_on:
      seed: {condition: service_completed_successfully}
    environment: *env
    command: ["java", "-jar", "/app/app.jar", "--spring.profiles.active=subject",
              "--spring.config.import=file:/config/split.properties",
              "--spring.jpa.hibernate.ddl-auto=none", "--dddsample.sample-data=false",
              "--server.tomcat.accesslog.prefix=access-service-4"]
    volumes: ["./split-service-4.properties:/config/split.properties:ro", "../runs/${RUN:-c3-test}:/app/logs"]

  router:
    <<: *limits
    image: nginx:1.27.3-alpine
    depends_on: [service-0, service-1, service-2, service-3, service-4]
    ports: ["8080:80"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
