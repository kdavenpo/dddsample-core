# The starting system (C0) behind the same router as C3, so both have the same extra hop (DECISIONS 65).
events {}
http {
    access_log off;
    upstream cargo_core { server cargo-core:8080; keepalive 32; }
    server {
        listen 80;
        location / {
            proxy_pass http://cargo_core;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
        }
    }
}
